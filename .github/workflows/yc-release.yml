# Personal fork only: after a build of yc-custom, publishes the Windows installer and the Android APK
# as release "yc-latest" with fixed file names:
#   https://github.com/<owner>/vcmi/releases/latest/download/VCMI-yc-windows-x64.exe
#   https://github.com/<owner>/vcmi/releases/latest/download/VCMI-yc-android-arm64.apk
name: YC publish build

on:
  workflow_run:
    workflows: ["Daily Builds and Tests"]
    types: [completed]
    branches: [yc-custom]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of a finished "Daily Builds and Tests" run of yc-custom'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: yc-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Resolve build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '"sha=\(.head_sha)\nurl=\(.html_url)"' >> "$GITHUB_OUTPUT"

      - name: Download Windows installer and Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          mkdir -p dl/windows dl/android
          fetch() {  # artifact name suffix, target dir
            local id name
            read -r id name < <(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq ".artifacts[] | select(.name | endswith(\"$1\")) | \"\(.id) \(.name)\"" | head -n 1) || true
            if [ -z "$id" ]; then echo "::warning::No artifact ending with $1"; return 0; fi
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "$2/download.bin"
            # artifacts uploaded with 'archive: false' arrive as the file itself, others as a zip around it
            python3 - "$2/download.bin" "$2/$name" "$1" <<'PY'
          import sys, zipfile, shutil
          src, dst, suffix = sys.argv[1:]
          if zipfile.is_zipfile(src):
              z = zipfile.ZipFile(src)
              inner = [n for n in z.namelist() if n.endswith(suffix.rsplit('-', 1)[-1])]
              if len(z.namelist()) == 1 and inner and not inner[0].endswith('AndroidManifest.xml'):
                  open(dst, 'wb').write(z.read(inner[0])); sys.exit()
          shutil.move(src, dst)
          PY
            rm -f "$2/download.bin"
            ls -la "$2"
          }
          fetch "-x64.exe" dl/windows
          fetch "-arm64-v8a.apk" dl/android

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.run.outputs.sha }}
          RUN_URL: ${{ steps.run.outputs.url }}
        run: |
          mkdir -p out
          exe=$(find dl/windows -type f -name '*.exe' | head -n 1 || true)
          apk=$(find dl/android -type f -name '*.apk' | head -n 1 || true)
          [ -n "$exe" ] && cp "$exe" out/VCMI-yc-windows-x64.exe
          [ -n "$apk" ] && cp "$apk" out/VCMI-yc-android-arm64.apk
          # keep the previous file of a platform that failed to build this time
          [ -z "$exe" ] && gh release download yc-latest -R "$REPO" -p VCMI-yc-windows-x64.exe -D out 2>/dev/null || true
          [ -z "$apk" ] && gh release download yc-latest -R "$REPO" -p VCMI-yc-android-arm64.apk -D out 2>/dev/null || true
          ls -la out
          if [ -z "$exe" ] && [ -z "$apk" ]; then
            echo "::error::Neither the Windows installer nor the Android APK was built in $RUN_URL"
            exit 1
          fi
          notes="Commit ${SHA:0:9}, built $(date -u '+%Y-%m-%d %H:%M') UTC. Build log: $RUN_URL"
          [ -z "$exe" ] && notes="$notes"$'\n'"Windows installer failed to build this time, the file is from an earlier build."
          [ -z "$apk" ] && notes="$notes"$'\n'"Android APK failed to build this time, the file is from an earlier build."
          gh release delete yc-latest -R "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create yc-latest out/* -R "$REPO" --target "$SHA" --title "VCMI yc-custom" --notes "$notes" --latest
