# Personal fork only: keeps yc-custom up to date with vcmi/vcmi develop and starts a build when something changed.
# Needs repository secret YC_SYNC_TOKEN (fine-grained token for this fork: Contents + Workflows read/write),
# because merges from upstream can change files under .github/workflows, which GITHUB_TOKEN may not push.
name: YC sync upstream

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: yc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yc-custom
        uses: actions/checkout@v7
        with:
          ref: yc-custom
          fetch-depth: 0
          token: ${{ secrets.YC_SYNC_TOKEN }}

      - name: Merge upstream develop
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/vcmi/vcmi.git
          git fetch --no-tags upstream develop
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/develop; then
            git merge --abort
            echo "::error::Merge conflict between yc-custom and vcmi/vcmi develop. Merge manually, then run this workflow again."
            exit 1
          fi
          if [ "$before" != "$(git rev-parse HEAD)" ]; then
            git push origin HEAD:yc-custom
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date."
          fi

      - name: Start build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github.yml --ref yc-custom -R "${{ github.repository }}"
